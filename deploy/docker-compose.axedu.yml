# AX-PBL deploy — drop-in service for the existing multi-container host.
# Pick ONE wiring option (A/B/C) after inspecting the existing reverse proxy
# (see deploy/DEPLOY.md step 1). Do NOT touch other services.
#
#   docker compose -f deploy/docker-compose.axedu.yml up -d --build
#
services:
  axedu-axpbl:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: axedu-axpbl:latest
    container_name: axedu-axpbl
    restart: unless-stopped

    # ── Option A — behind Traefik (label-based routing) ───────────────────────
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.axedu.rule=Host(`axedu.pusan.ac.kr`)"
    #   - "traefik.http.routers.axedu.entrypoints=websecure"
    #   - "traefik.http.routers.axedu.tls=true"
    #   - "traefik.http.services.axedu.loadbalancer.server.port=80"
    # networks: [proxy]

    # ── Option B — behind nginx-proxy (jwilder / nginxproxy) ──────────────────
    # environment:
    #   - VIRTUAL_HOST=axedu.pusan.ac.kr
    #   - VIRTUAL_PORT=80
    #   # - LETSENCRYPT_HOST=axedu.pusan.ac.kr   # if acme-companion is present
    # networks: [proxy]

    # ── Option C — standalone: publish a host port, route via a manual vhost ──
    ports:
      - "8088:80"

# Uncomment + set to the EXISTING proxy network name (from `docker network ls`)
# if you use Option A or B:
# networks:
#   proxy:
#     external: true
#     name: REPLACE_WITH_EXISTING_PROXY_NETWORK
