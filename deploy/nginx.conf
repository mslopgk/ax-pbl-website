# AX-PBL — nginx vhost (inside the container).
# The front reverse-proxy routes axedu.pusan.ac.kr → this container:80,
# so we answer for any host (_) and let the proxy own TLS/host matching.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # security-ish defaults
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # hashed build assets — cache hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # logos / images
  location /logos/        { expires 30d; try_files $uri =404; }
  location = /concept-map.jpg { expires 30d; try_files $uri =404; }

  # design concept mockups (static .html, incl. the 3D WebGL files)
  location /concepts/ {
    try_files $uri $uri/ =404;
  }

  # SPA: client-side routes (/curriculum, /cases) fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
